name: Windows Signed Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-sign:
    name: Build and Sign Windows Artifacts
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.*

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installers
        shell: pwsh
        run: .\installers\build-installer.ps1 -Target all

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem installers\output\*.exe, installers\output\*.msi |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content installers\output\SHA256SUMS.txt

      - name: Sign EXE/MSI with Sigstore bundles
        shell: pwsh
        run: |
          Get-ChildItem installers\output\*.exe, installers\output\*.msi |
            ForEach-Object {
              cosign sign-blob --yes `
                --bundle "$($_.FullName).sigstore.json" `
                $_.FullName
            }

      - name: Verify EXE/MSI signatures
        shell: pwsh
        run: |
          Get-ChildItem installers\output\*.exe, installers\output\*.msi |
            ForEach-Object {
              cosign verify-blob `
                --bundle "$($_.FullName).sigstore.json" `
                --certificate-identity-regexp "^https://github.com/${env:GITHUB_REPOSITORY}/.github/workflows/" `
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" `
                $_.FullName
            }

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-signed
          path: |
            installers/output/*.exe
            installers/output/*.msi
            installers/output/*.sigstore.json
            installers/output/SHA256SUMS.txt
