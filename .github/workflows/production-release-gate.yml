name: Production Release Gate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify, e.g. v2.0.0 or v2.0.0-rc.1
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

jobs:
  release-contract:
    name: Validate Release Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}

    steps:
      - name: Validate tag and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi

          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft)"
          release_tag="$(jq -r '.tagName' <<<"$release_json")"
          is_draft="$(jq -r '.isDraft' <<<"$release_json")"

          if [[ "$release_tag" != "$TAG" ]]; then
            echo "Release tag mismatch: $release_tag != $TAG" >&2
            exit 1
          fi

          if [[ "$is_draft" != "false" ]]; then
            echo "Release $TAG is still a draft." >&2
            exit 1
          fi

          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          direct_sha="$(git ls-remote "$remote" "refs/tags/$TAG" | awk '{print $1}')"
          peeled_sha="$(git ls-remote "$remote" "refs/tags/$TAG^{}" | awk '{print $1}')"

          if [[ -n "$peeled_sha" ]]; then
            release_sha="$peeled_sha"
          else
            release_sha="$direct_sha"
          fi

          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve commit for tag $TAG." >&2
            exit 1
          fi

          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  integrity:
    name: Verify SHA256 and GitHub Attestations
    needs: [release-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release

      - name: Validate release asset contract
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          source_artifacts=(release/char-code-"${TAG}".tar.gz)
          all_source_artifacts=(release/char-code-*.tar.gz)
          exe_files=(release/*.exe)
          msi_files=(release/*.msi)
          manifests=(release/SHA256SUMS.txt)

          [ "${#source_artifacts[@]}" -eq 1 ]
          [ "${#all_source_artifacts[@]}" -eq 1 ]
          [ "${#exe_files[@]}" -ge 1 ]
          [ "${#msi_files[@]}" -ge 1 ]
          [ "${#manifests[@]}" -eq 1 ]

      - name: Verify SHA-256 manifest
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release
          sha256sum --check --strict SHA256SUMS.txt

          required_files=("char-code-${TAG}.tar.gz" *.exe *.msi)
          for file in "${required_files[@]}"; do
            count="$(
              awk -v wanted="$file" '
                {
                  name = $2
                  sub(/^\*/, "", name)
                  if (name == wanted) count++
                }
                END { print count + 0 }
              ' SHA256SUMS.txt
            )"

            if [[ "$count" -ne 1 ]]; then
              echo "Expected one checksum entry for $file; found $count." >&2
              exit 1
            fi
          done

      - name: Verify GitHub artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=("release/char-code-${TAG}.tar.gz" release/*.exe release/*.msi)
          for file in "${files[@]}"; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done

  sigstore:
    name: Verify Sigstore Signatures
    needs: [release-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify Windows Sigstore bundles
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          subjects=(release/*.exe release/*.msi)

          if [[ "${#subjects[@]}" -lt 2 ]]; then
            echo "Expected EXE and MSI release artifacts." >&2
            exit 1
          fi

          for subject in "${subjects[@]}"; do
            bundle="${subject}.sigstore.json"
            test -f "$bundle"

            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$subject"
          done

  containers:
    name: Verify Signed Container Images
    needs: [release-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      api_image: ${{ steps.manifest.outputs.api_image }}
      web_image: ${{ steps.manifest.outputs.web_image }}

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve and verify immutable images
        id: manifest
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY,,}"
          repo="${repo%-}"
          api_tag="ghcr.io/${repo}/api:${TAG}"
          web_tag="ghcr.io/${repo}/web:${TAG}"

          api_digest="$(docker buildx imagetools inspect "$api_tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          web_digest="$(docker buildx imagetools inspect "$web_tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"

          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$web_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          api_image="ghcr.io/${repo}/api@${api_digest}"
          web_image="ghcr.io/${repo}/web@${web_digest}"

          for image in "$api_image" "$web_image"; do
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sign-containers.yml@" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$image"
          done

          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
          echo "web_image=$web_image" >> "$GITHUB_OUTPUT"

  slsa:
    name: Verify SLSA Provenance
    needs: [release-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release

      - name: Install SLSA verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Verify exact source provenance
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          source_artifact="release/char-code-${TAG}.tar.gz"
          provenance="release/release.intoto.jsonl"
          source_candidates=(release/char-code-*.tar.gz)
          provenance_candidates=(release/*.intoto.jsonl)

          [ "${#source_candidates[@]}" -eq 1 ]
          [ "${source_candidates[0]}" = "$source_artifact" ]
          [ "${#provenance_candidates[@]}" -eq 1 ]
          [ "${provenance_candidates[0]}" = "$provenance" ]

          slsa-verifier verify-artifact "$source_artifact" \
            --provenance-path "$provenance" \
            --source-uri "github.com/${GITHUB_REPOSITORY}" \
            --source-tag "$TAG"

  authenticode:
    name: Verify Windows Authenticode
    needs: [release-contract]
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Download release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force release | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir release

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to download release $env:TAG."
          }

      - name: Verify Authenticode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exeFiles = @(Get-ChildItem release\*.exe -File -ErrorAction SilentlyContinue)
          $msiFiles = @(Get-ChildItem release\*.msi -File -ErrorAction SilentlyContinue)

          if ($exeFiles.Count -lt 1) {
              throw "No EXE release artifacts found."
          }

          if ($msiFiles.Count -lt 1) {
              throw "No MSI release artifacts found."
          }

          foreach ($file in @($exeFiles + $msiFiles)) {
              $signature = Get-AuthenticodeSignature $file.FullName

              if ($signature.Status -ne "Valid") {
                  throw "Authenticode verification failed for $($file.Name): $($signature.Status)"
              }

              if (-not $signature.SignerCertificate) {
                  throw "Missing signer certificate for $($file.Name)."
              }
          }

  production-approved:
    name: Production Artifact Gate
    needs:
      - release-contract
      - integrity
      - sigstore
      - containers
      - slsa
      - authenticode
    runs-on: ubuntu-latest
    environment: production-approval

    steps:
      - name: Create immutable deployment manifest
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.release-contract.outputs.release_sha }}
          API_IMAGE: ${{ needs.containers.outputs.api_image }}
          WEB_IMAGE: ${{ needs.containers.outputs.web_image }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$API_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]

          mkdir deployment

          cat > deployment/verified-release.env <<EOF
          RELEASE_TAG=$TAG
          RELEASE_SHA=$RELEASE_SHA
          API_IMAGE=$API_IMAGE
          WEB_IMAGE=$WEB_IMAGE
          VERIFIED_GATE_RUN=$GITHUB_RUN_ID
          EOF

          cat deployment/verified-release.env

      - name: Upload verified deployment manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-production-release
          path: deployment/verified-release.env
          if-no-files-found: error
          retention-days: 30
