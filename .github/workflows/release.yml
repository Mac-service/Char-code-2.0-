name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://char_code_release:char_code_release@127.0.0.1:5432/char_code_release
  MIGRATION_DATABASE_URL: postgresql://char_code_release:char_code_release@127.0.0.1:5432/char_code_release

jobs:
  build-source:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release source
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          npm run test:e2e
          npm run validate

      - name: Package deterministic source distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          tar \
            --sort=name \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='release' \
            -cf - . \
            | gzip -n \
            > "release/char-code-${GITHUB_REF_NAME}.tar.gz"

      - name: Verify source artifact
        shell: bash
        run: test -s "release/char-code-${GITHUB_REF_NAME}.tar.gz"

      - name: Attest source artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*.tar.gz

      - name: Upload source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-source
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows-signing:
    name: Build and Sign Windows Release
    uses: ./.github/workflows/azure-artifact-signing.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  prepare-slsa-subjects:
    name: Prepare Final SLSA Subjects
    needs:
      - build-source
      - windows-signing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: Download source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source
          path: subjects

      - name: Download signed Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows
          path: subjects

      - name: Generate SLSA subjects
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd subjects
          files=( *.tar.gz *.exe *.msi )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found for SLSA provenance." >&2
            exit 1
          fi
          sha256sum "${files[@]}" > subjects.sha256
          echo "hashes=$(base64 -w0 subjects.sha256)" >> "$GITHUB_OUTPUT"

  slsa-provenance:
    name: Generate SLSA Provenance
    needs:
      - prepare-slsa-subjects
    uses: ./.github/workflows/slsa-provenance.yml
    with:
      base64-subjects: ${{ needs.prepare-slsa-subjects.outputs.hashes }}
    permissions:
      actions: read
      id-token: write
      contents: write

  publish:
    name: Publish GitHub Release
    needs:
      - build-source
      - windows-signing
      - slsa-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          source_archives=(release-assets/*.tar.gz)
          exe_files=(release-assets/*.exe)
          msi_files=(release-assets/*.msi)

          [ "${#source_archives[@]}" -eq 1 ]
          [ "${#exe_files[@]}" -ge 1 ]
          [ "${#msi_files[@]}" -ge 1 ]

          for file in "${exe_files[@]}" "${msi_files[@]}"; do
            test -f "${file}.sigstore.json"
          done

      - name: Generate combined SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . \
            -maxdepth 1 \
            -type f \
            ! -name 'SHA256SUMS*.txt' \
            -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: |
            release-assets/*
