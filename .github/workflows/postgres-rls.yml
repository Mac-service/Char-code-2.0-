name: PostgreSQL RLS

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  rls:
    name: Real PostgreSQL RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-only
          POSTGRES_DB: char_code
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d char_code"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres-test-only@127.0.0.1:5432/char_code
      DATABASE_URL: postgresql://postgres:postgres-test-only@127.0.0.1:5432/char_code
      RLS_TEST_PASSWORD: Rls-Test-Only-2026-Runner

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma
        run: npm run prisma:validate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Run real PostgreSQL RLS tests
        run: npm run test:rls

      - name: Run atomic outbox concurrency tests
        run: npm run test:outbox
