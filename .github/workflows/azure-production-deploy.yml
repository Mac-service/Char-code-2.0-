name: Azure Production Deployment

on:
  workflow_run:
    workflows: ["Production Release Gate"]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: char-code-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Verified Release to Azure
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Download verification manifest from gate run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          mkdir verified
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name verified-production-release \
            --dir verified

          test -f verified/verified-release.env
          cat verified/verified-release.env >> "$GITHUB_ENV"

      - name: Validate immutable image references
        shell: bash
        run: |
          [[ "$API_IMAGE" =~ ^ghcr\.io/.+@sha256:[a-f0-9]{64}$ ]]
          [[ "$WEB_IMAGE" =~ ^ghcr\.io/.+@sha256:[a-f0-9]{64}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]

      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure API immutable image
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          API_APP: ${{ vars.AZURE_API_APP_NAME }}
        run: |
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP" \
            --container-image-name "$API_IMAGE" \
            --container-registry-url "https://ghcr.io" \
            --container-registry-user "${{ secrets.GHCR_PULL_USERNAME }}" \
            --container-registry-password "${{ secrets.GHCR_PULL_TOKEN }}"

      - name: Configure Web immutable image
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEB_APP: ${{ vars.AZURE_WEB_APP_NAME }}
        run: |
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP" \
            --container-image-name "$WEB_IMAGE" \
            --container-registry-url "https://ghcr.io" \
            --container-registry-user "${{ secrets.GHCR_PULL_USERNAME }}" \
            --container-registry-password "${{ secrets.GHCR_PULL_TOKEN }}"

      - name: Restart applications
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          API_APP: ${{ vars.AZURE_API_APP_NAME }}
          WEB_APP: ${{ vars.AZURE_WEB_APP_NAME }}
        run: |
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$API_APP"
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$WEB_APP"

      - name: Smoke test Front Door endpoint
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --max-time 10 \
              "${PRODUCTION_URL%/}/backend/health/live"; then
              exit 0
            fi
            sleep 10
          done

          echo "Production smoke test failed."
          exit 1

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Char-code production deployment"
            echo ""
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- API: \`$API_IMAGE\`"
            echo "- Web: \`$WEB_IMAGE\`"
            echo "- Verification gate run: \`$VERIFIED_GATE_RUN\`"
          } >> "$GITHUB_STEP_SUMMARY"
