services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: char_code
      POSTGRES_USER: char_code
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - char_code_pg:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U char_code -d char_code"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://char_code:${POSTGRES_PASSWORD}@postgres:5432/char_code
      DATABASE_MODE: prisma
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app, data]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      DATABASE_MODE: prisma
      DATABASE_URL: postgresql://char_code:${POSTGRES_PASSWORD}@postgres:5432/char_code
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Siec 'app' zapewnia wyjscie na zewnatrz dla SMTP; 'data' jest internal.
    networks: [app, data]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    networks: [app]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
    restart: unless-stopped

networks:
  app:
  data:
    internal: true

volumes:
  char_code_pg:
